spring.application.name=tasks-api

# Credentials come from the environment. The fallbacks are local-development
# defaults for the throwaway `tasks` database on localhost; set DB_PASSWORD (and
# the others) in any environment that is not a developer laptop.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasks}
spring.datasource.username=${DB_USERNAME:tasks}
spring.datasource.password=${DB_PASSWORD:tasks}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors are rendered as RFC 9457 ProblemDetail everywhere, including framework
# exceptions that never reach ApiExceptionHandler.
spring.mvc.problemdetails.enabled=true

server.port=8080
